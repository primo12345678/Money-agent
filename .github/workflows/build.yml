name: Build MoneyAgent APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        run: |
          python -m py_compile backend/*.py
          python -m unittest discover -s tests -v
          python -c "import json; r=json.load(open('report.json')); assert r['safety']['auto_send'] is False and r['safety']['auto_spend'] is False"
  build-apk:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable signing key
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, io, os, pathlib, zipfile
          raw = os.environ.get("SIGNING_BUNDLE", "").strip()
          if not raw:
              raise SystemExit("Missing repository secret ANDROID_SIGNING_BUNDLE_BASE64")
          try:
              decoded = base64.b64decode("".join(raw.split()), validate=True)
          except Exception as exc:
              raise SystemExit("Signing secret is not valid Base64; recreate the Base64 ZIP value.") from exc
          stream = io.BytesIO(decoded)
          if not zipfile.is_zipfile(stream):
              raise SystemExit("Signing secret decodes but is not a ZIP. Expected ZIP containing moneyagent-release.jks and password.txt.")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "android-signing"
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(stream) as archive:
              files = {pathlib.PurePosixPath(n).name: n for n in archive.namelist() if not n.endswith("/")}
              for name in ("moneyagent-release.jks", "password.txt"):
                  if name not in files:
                      raise SystemExit("Signing ZIP is missing " + name)
                  data = archive.read(files[name])
                  if not data:
                      raise SystemExit("Signing ZIP contains an empty " + name)
                  (target / name).write_bytes(data)
          password = (target / "password.txt").read_text(encoding="utf-8").strip()
          if not password:
              raise SystemExit("Signing password file is empty")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("ANDROID_KEYSTORE_PATH=" + str(target / "moneyagent-release.jks") + "\n")
              env.write("ANDROID_KEYSTORE_PASSWORD=" + password + "\n")
          PY
      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: moneyagent
        run: |
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Building with the configured stable signing key."
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::Stable signing key is not configured or could not be validated. Building a temporary debug-signed APK; do not use it for a permanent installation."
          fi
          gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyAgent-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
