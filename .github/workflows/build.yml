name: Build MoneyAgent APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A single protected repository secret contains the keystore and password.
      # Pull-request builds use the disposable debug key and are not for installation.
      - name: Prepare stable signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_BUNDLE_BASE64" || (echo "::error::Missing ANDROID_SIGNING_BUNDLE_BASE64 repository secret" && exit 1)
          echo "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing-bundle.zip"
          mkdir -p "$RUNNER_TEMP/android-signing"
          unzip -q "$RUNNER_TEMP/android-signing-bundle.zip" -d "$RUNNER_TEMP/android-signing"
          test -s "$RUNNER_TEMP/android-signing/moneyagent-release.jks"
          test -s "$RUNNER_TEMP/android-signing/password.txt"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/moneyagent-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/android-signing/password.txt")" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: moneyagent
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '' || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyAgent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
