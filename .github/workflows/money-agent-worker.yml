
name: Money Agent Worker
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hunter
        run: python backend/hunter.py

      - name: Run Analyst
        run: python backend/analyst.py

      - name: Run Deal Maker
        run: python backend/deal_maker.py

      - name: Validate Agent
        run: |
          python -m py_compile backend/hunter.py
          python -m py_compile backend/analyst.py
          python -m py_compile backend/deal_maker.py

          python - <<'PY'
          import json

          with open("report.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          opportunities = report.get("opportunities", [])

          print("Money Agent validation")
          print("Opportunities:", len(opportunities))

          if not isinstance(opportunities, list):
              raise SystemExit("Invalid opportunities format")

          deal_maker = report.get("deal_maker", {})

          print(
              "Deal Maker status:",
              deal_maker.get("status")
          )

          print(
              "Drafts:",
              deal_maker.get("draft_count", 0)
          )

          print("Validation: OK")

          if deal_maker.get("status") != "drafts_ready_for_human_review":
              raise SystemExit("Deal Maker did not produce drafts")

          if deal_maker.get("draft_count", 0) == 0:
              raise SystemExit("No deal drafts generated")
          PY

      - name: Save report
        run: |
          git config user.name "Money Agent"
          git config user.email "money-agent@users.noreply.github.com"

          git add report.json

          git diff --cached --quiet || \
            git commit -m "Update Money Agent opportunity and deal report"

          git push