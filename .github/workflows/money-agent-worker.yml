name: Money Agent Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write
jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Money Agent
        run: python backend/hunter.py

      - name: Save report
        run: |
          git config user.name "Money Agent"
          git config user.email "money-agent@users.noreply.github.com"
          git add report.json
          git diff --cached --quiet || git commit -m "Update Money Agent report"
          git push