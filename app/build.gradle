plugins {
    id 'com.android.application'
}

def stableKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def stableStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def stableKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def stableKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasStableSigning = [stableKeystorePath, stableStorePassword, stableKeyAlias, stableKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace 'com.moneyagent'
    compileSdk 35

    defaultConfig {
        // New package ID avoids replacing either legacy install and preserves their local data.
        applicationId 'com.moneyagent.mobile'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    if (hasStableSigning) {
        signingConfigs {
            stable {
                storeFile file(stableKeystorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }

        buildTypes {
            debug {
                signingConfig signingConfigs.stable
            }
        }
    }
}
